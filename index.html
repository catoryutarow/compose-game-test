<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8BIT MUSIC FACTORY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- ヘッダー -->
        <header class="header">
            <div class="header-top">
                <div class="title-box">
                    <h1>8BIT MUSIC</h1>
                    <div class="subtitle">- FACTORY -</div>
                </div>
                <a href="admin.html" class="admin-link pixel-btn-small">ADMIN</a>
            </div>
            <div class="pack-selector">
                <span class="pack-label">PACK:</span>
                <select id="packSelect" class="pack-select">
                    <!-- パックがここに表示される -->
                </select>
            </div>
        </header>

        <!-- メインステージ -->
        <main class="main-stage">
            <div class="characters-grid">
                <!-- キャラクター1 -->
                <div class="character" data-slot="0">
                    <div class="pixel-character color-1">
                        <div class="pixel-head">
                            <div class="pixel-eyes">
                                <div class="pixel-eye"></div>
                                <div class="pixel-eye"></div>
                            </div>
                            <div class="pixel-mouth"></div>
                        </div>
                        <div class="pixel-body"></div>
                    </div>
                    <div class="sound-badge" data-slot="0"></div>
                    <span class="character-name">PIKO</span>
                </div>
                <!-- キャラクター2 -->
                <div class="character" data-slot="1">
                    <div class="pixel-character color-2">
                        <div class="pixel-head">
                            <div class="pixel-eyes">
                                <div class="pixel-eye"></div>
                                <div class="pixel-eye"></div>
                            </div>
                            <div class="pixel-mouth"></div>
                        </div>
                        <div class="pixel-body"></div>
                    </div>
                    <div class="sound-badge" data-slot="1"></div>
                    <span class="character-name">POKO</span>
                </div>
                <!-- キャラクター3 -->
                <div class="character" data-slot="2">
                    <div class="pixel-character color-3">
                        <div class="pixel-head">
                            <div class="pixel-eyes">
                                <div class="pixel-eye"></div>
                                <div class="pixel-eye"></div>
                            </div>
                            <div class="pixel-mouth"></div>
                        </div>
                        <div class="pixel-body"></div>
                    </div>
                    <div class="sound-badge" data-slot="2"></div>
                    <span class="character-name">RUN</span>
                </div>
                <!-- キャラクター4 -->
                <div class="character" data-slot="3">
                    <div class="pixel-character color-4">
                        <div class="pixel-head">
                            <div class="pixel-eyes">
                                <div class="pixel-eye"></div>
                                <div class="pixel-eye"></div>
                            </div>
                            <div class="pixel-mouth"></div>
                        </div>
                        <div class="pixel-body"></div>
                    </div>
                    <div class="sound-badge" data-slot="3"></div>
                    <span class="character-name">DON</span>
                </div>
                <!-- キャラクター5 -->
                <div class="character" data-slot="4">
                    <div class="pixel-character color-5">
                        <div class="pixel-head">
                            <div class="pixel-eyes">
                                <div class="pixel-eye"></div>
                                <div class="pixel-eye"></div>
                            </div>
                            <div class="pixel-mouth"></div>
                        </div>
                        <div class="pixel-body"></div>
                    </div>
                    <div class="sound-badge" data-slot="4"></div>
                    <span class="character-name">MELO</span>
                </div>
                <!-- キャラクター6 -->
                <div class="character" data-slot="5">
                    <div class="pixel-character color-6">
                        <div class="pixel-head">
                            <div class="pixel-eyes">
                                <div class="pixel-eye"></div>
                                <div class="pixel-eye"></div>
                            </div>
                            <div class="pixel-mouth"></div>
                        </div>
                        <div class="pixel-body"></div>
                    </div>
                    <div class="sound-badge" data-slot="5"></div>
                    <span class="character-name">HAMO</span>
                </div>
            </div>

            <!-- ビートインジケーター -->
            <div class="beat-indicator">
                <div class="beat-dot"></div>
                <div class="beat-dot"></div>
                <div class="beat-dot"></div>
                <div class="beat-dot"></div>
                <div class="beat-dot"></div>
                <div class="beat-dot"></div>
                <div class="beat-dot"></div>
                <div class="beat-dot"></div>
            </div>
        </main>

        <!-- コントロールバー -->
        <div class="control-bar">
            <button id="playBtn" class="pixel-btn play-btn">
                <span class="btn-text">PLAY</span>
            </button>
            <div class="tempo-control">
                <span class="tempo-label">BPM</span>
                <input type="range" id="tempo" min="60" max="180" value="120">
                <span id="tempoValue" class="tempo-value">120</span>
            </div>
            <button id="resetBtn" class="pixel-btn reset-btn">RST</button>
        </div>

        <!-- サウンドピッカー -->
        <div class="sound-picker" id="soundPicker">
            <div class="picker-handle" id="pickerHandle">
                <div class="handle-bar"></div>
                <span class="picker-title">SELECT SOUND</span>
            </div>
            <div class="picker-content">
                <div class="category-tabs">
                    <button class="pixel-tab active" data-category="beat">BEAT</button>
                    <button class="pixel-tab" data-category="melody">MELO</button>
                    <button class="pixel-tab" data-category="bass">BASS</button>
                    <button class="pixel-tab" data-category="fx">FX</button>
                </div>

                <div class="sounds-container">
                    <div class="sound-grid" data-category="beat">
                        <button class="pixel-sound-btn" data-sound="kick">
                            <span class="sound-icon">♪</span>
                            <span class="sound-label">KICK</span>
                        </button>
                        <button class="pixel-sound-btn" data-sound="snare">
                            <span class="sound-icon">♫</span>
                            <span class="sound-label">SNARE</span>
                        </button>
                        <button class="pixel-sound-btn" data-sound="hihat">
                            <span class="sound-icon">♩</span>
                            <span class="sound-label">HIHAT</span>
                        </button>
                    </div>
                    <div class="sound-grid hidden" data-category="melody">
                        <button class="pixel-sound-btn" data-sound="synth1">
                            <span class="sound-icon">▶</span>
                            <span class="sound-label">LEAD1</span>
                        </button>
                        <button class="pixel-sound-btn" data-sound="synth2">
                            <span class="sound-icon">◀</span>
                            <span class="sound-label">LEAD2</span>
                        </button>
                        <button class="pixel-sound-btn" data-sound="piano">
                            <span class="sound-icon">▲</span>
                            <span class="sound-label">ARP</span>
                        </button>
                    </div>
                    <div class="sound-grid hidden" data-category="bass">
                        <button class="pixel-sound-btn" data-sound="bass1">
                            <span class="sound-icon">▼</span>
                            <span class="sound-label">BASS1</span>
                        </button>
                        <button class="pixel-sound-btn" data-sound="bass2">
                            <span class="sound-icon">■</span>
                            <span class="sound-label">BASS2</span>
                        </button>
                    </div>
                    <div class="sound-grid hidden" data-category="fx">
                        <button class="pixel-sound-btn" data-sound="fx1">
                            <span class="sound-icon">★</span>
                            <span class="sound-label">POWER</span>
                        </button>
                        <button class="pixel-sound-btn" data-sound="fx2">
                            <span class="sound-icon">●</span>
                            <span class="sound-label">COIN</span>
                        </button>
                        <button class="pixel-sound-btn" data-sound="vocal">
                            <span class="sound-icon">↑</span>
                            <span class="sound-label">JUMP</span>
                        </button>
                    </div>
                </div>

                <button class="pixel-btn remove-btn" id="removeSoundBtn">
                    REMOVE
                </button>
            </div>
        </div>

        <div class="overlay" id="overlay"></div>
    </div>

    <script src="pack-data.js"></script>
    <script src="audio.js"></script>
    <script src="app.js"></script>
</body>
</html>
