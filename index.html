<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 おんがくファクトリー 🎵</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 おんがくファクトリー 🎵</h1>
            <p class="subtitle">キャラクターにサウンドをドラッグして、オリジナル曲を作ろう！</p>
        </header>

        <div class="controls">
            <button id="playBtn" class="control-btn">
                <span class="btn-icon">▶</span>
                <span class="btn-text">スタート</span>
            </button>
            <button id="stopBtn" class="control-btn">
                <span class="btn-icon">■</span>
                <span class="btn-text">ストップ</span>
            </button>
            <button id="resetBtn" class="control-btn">
                <span class="btn-icon">🔄</span>
                <span class="btn-text">リセット</span>
            </button>
            <div class="tempo-control">
                <label for="tempo">テンポ: <span id="tempoValue">120</span> BPM</label>
                <input type="range" id="tempo" min="60" max="180" value="120">
            </div>
        </div>

        <div class="stage">
            <div class="characters-container">
                <div class="character" data-slot="0">
                    <div class="character-body">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <div class="sound-slot" data-slot="0">
                        <span class="slot-hint">ここにドロップ</span>
                    </div>
                    <div class="character-name">ピコちゃん</div>
                </div>
                <div class="character" data-slot="1">
                    <div class="character-body color-2">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <div class="sound-slot" data-slot="1">
                        <span class="slot-hint">ここにドロップ</span>
                    </div>
                    <div class="character-name">ポコくん</div>
                </div>
                <div class="character" data-slot="2">
                    <div class="character-body color-3">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <div class="sound-slot" data-slot="2">
                        <span class="slot-hint">ここにドロップ</span>
                    </div>
                    <div class="character-name">ルンルン</div>
                </div>
                <div class="character" data-slot="3">
                    <div class="character-body color-4">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <div class="sound-slot" data-slot="3">
                        <span class="slot-hint">ここにドロップ</span>
                    </div>
                    <div class="character-name">ドンドン</div>
                </div>
                <div class="character" data-slot="4">
                    <div class="character-body color-5">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <div class="sound-slot" data-slot="4">
                        <span class="slot-hint">ここにドロップ</span>
                    </div>
                    <div class="character-name">メロディ</div>
                </div>
                <div class="character" data-slot="5">
                    <div class="character-body color-6">
                        <div class="character-face">
                            <div class="eyes">
                                <div class="eye left"></div>
                                <div class="eye right"></div>
                            </div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <div class="sound-slot" data-slot="5">
                        <span class="slot-hint">ここにドロップ</span>
                    </div>
                    <div class="character-name">ハーモニー</div>
                </div>
            </div>
        </div>

        <div class="sound-library">
            <h2>🎶 サウンドライブラリ 🎶</h2>
            <div class="sound-categories">
                <div class="category">
                    <h3>🥁 ビート</h3>
                    <div class="sounds">
                        <div class="sound-item" draggable="true" data-sound="kick" data-category="beat">
                            <span class="sound-icon">🔊</span>
                            <span class="sound-name">キック</span>
                        </div>
                        <div class="sound-item" draggable="true" data-sound="snare" data-category="beat">
                            <span class="sound-icon">🥁</span>
                            <span class="sound-name">スネア</span>
                        </div>
                        <div class="sound-item" draggable="true" data-sound="hihat" data-category="beat">
                            <span class="sound-icon">🎪</span>
                            <span class="sound-name">ハイハット</span>
                        </div>
                    </div>
                </div>
                <div class="category">
                    <h3>🎹 メロディ</h3>
                    <div class="sounds">
                        <div class="sound-item" draggable="true" data-sound="synth1" data-category="melody">
                            <span class="sound-icon">🎹</span>
                            <span class="sound-name">シンセ1</span>
                        </div>
                        <div class="sound-item" draggable="true" data-sound="synth2" data-category="melody">
                            <span class="sound-icon">🎼</span>
                            <span class="sound-name">シンセ2</span>
                        </div>
                        <div class="sound-item" draggable="true" data-sound="piano" data-category="melody">
                            <span class="sound-icon">🎵</span>
                            <span class="sound-name">ピアノ</span>
                        </div>
                    </div>
                </div>
                <div class="category">
                    <h3>🎸 ベース</h3>
                    <div class="sounds">
                        <div class="sound-item" draggable="true" data-sound="bass1" data-category="bass">
                            <span class="sound-icon">🎸</span>
                            <span class="sound-name">ベース1</span>
                        </div>
                        <div class="sound-item" draggable="true" data-sound="bass2" data-category="bass">
                            <span class="sound-icon">📻</span>
                            <span class="sound-name">ベース2</span>
                        </div>
                    </div>
                </div>
                <div class="category">
                    <h3>✨ エフェクト</h3>
                    <div class="sounds">
                        <div class="sound-item" draggable="true" data-sound="fx1" data-category="fx">
                            <span class="sound-icon">✨</span>
                            <span class="sound-name">キラキラ</span>
                        </div>
                        <div class="sound-item" draggable="true" data-sound="fx2" data-category="fx">
                            <span class="sound-icon">🌟</span>
                            <span class="sound-name">シュワー</span>
                        </div>
                        <div class="sound-item" draggable="true" data-sound="vocal" data-category="fx">
                            <span class="sound-icon">🎤</span>
                            <span class="sound-name">ボイス</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>🌈 おんがくファクトリーで楽しく作曲しよう！ 🌈</p>
        </footer>
    </div>

    <script src="audio.js"></script>
    <script src="app.js"></script>
</body>
</html>
